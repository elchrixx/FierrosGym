<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fierros Gym</title>
<meta name="description" content="Fierros Gym: gimnasio en Ciudad de México con app de socio, clases grupales, rutina y plan alimenticio personalizados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#F5F6F2; --ink:#17202A; --muted:#5A6570; --line:#D5D9D2;
  --red:#C8102E; --blue:#1E56B0; --yellow:#C9960A; --green:#1F7A4B; --on-ink:#FFFFFF;
  --red-soft:#F9E3E6; --yellow-soft:#FBF1D2; --green-soft:#DFF0E6; --blue-soft:#E1EAF8;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#1A2129; --surface-2:#212A33; --ink:#E8ECE5; --muted:#98A3AD; --line:#2D3742;
    --red:#F0485E; --blue:#6B9BEA; --yellow:#F0C23A; --green:#46B97C; --on-ink:#11161C;
    --red-soft:#3A1C22; --yellow-soft:#3A3117; --green-soft:#16332A; --blue-soft:#1B2A44;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --surface-2:#212A33; --ink:#E8ECE5; --muted:#98A3AD; --line:#2D3742;
  --red:#F0485E; --blue:#6B9BEA; --yellow:#F0C23A; --green:#46B97C; --on-ink:#11161C;
  --red-soft:#3A1C22; --yellow-soft:#3A3117; --green-soft:#16332A; --blue-soft:#1B2A44;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.6rem,7vw,4.4rem)}
h2{font-size:clamp(1.9rem,4.5vw,2.6rem)}
h3{font-size:1.45rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}

/* Shell */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.6rem;letter-spacing:.01em}
.brand svg{width:34px;height:20px}
#top .spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem;border:0}
.shell{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
#side{display:none}
main#view{padding:20px 18px 110px;min-width:0}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button,#side button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
#tabs button svg,#side button svg{width:22px;height:22px}
#tabs button[aria-current="page"],#side button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] svg{stroke:var(--ink)}
body:not(.mode-app) #tabs,body:not(.mode-app) #side{display:none!important}
body.mode-reg main#view{padding-bottom:40px}
@media (min-width:900px){
  .shell{grid-template-columns:220px 1fr}
  #side{display:flex;flex-direction:column;gap:4px;padding:22px 12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start}
  #side button{flex-direction:row;gap:12px;font-size:.98rem;padding:10px 12px;justify-content:flex-start}
  #side button[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--ink)}
  #tabs{display:none}
  main#view{padding:28px 28px 60px}
  body.mode-reg .shell{grid-template-columns:1fr}
}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Blocks */
.stack{display:grid;gap:18px}
.grid2{display:grid;gap:18px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel.flat{background:var(--surface-2)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.pagehead{display:grid;gap:6px;margin-bottom:18px}
.pagehead p{max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);font-weight:700;padding:11px 18px;border-radius:10px;min-height:44px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tag.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
.tag.yellow{background:var(--yellow-soft);border-color:transparent;color:var(--yellow)}
.tag.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.tag.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}

/* Alert banner */
.alert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:14px;padding:14px 16px;margin-bottom:18px;border-left:6px solid}
.alert.warn{background:var(--yellow-soft);border-color:var(--yellow)}
.alert.bad{background:var(--red-soft);border-color:var(--red)}
.alert p{flex:1 1 220px}
.alert strong{display:block}

/* Barbell membership */
.membership{display:grid;gap:16px}
.days-left{display:flex;align-items:baseline;gap:10px}
.days-left b{font-family:var(--display);font-size:clamp(4rem,12vw,6rem);font-weight:900;line-height:.85}
.days-left span{font-weight:600;color:var(--muted);max-width:14ch;line-height:1.25}
.barbell{width:100%;height:auto;display:block}
.barbell .plate{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
@media (prefers-reduced-motion:reduce){.barbell .plate{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* Forms */
form{display:grid;gap:16px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:14px}
legend{font-family:var(--display);font-weight:800;font-size:1.45rem;margin-bottom:6px}
.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.f input,.f select,.f textarea,input.in{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:44px}
.f input:focus,.f select:focus,input.in:focus{border-color:var(--ink);outline:none}
.fgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.choices{display:grid;gap:10px}
.choices.c3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:grid;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;height:100%}
.choice label b{font-weight:700}
.choice label .price{font-family:var(--display);font-size:1.6rem;font-weight:800}
.choice input:checked+label{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.choice input:focus-visible+label{outline:3px solid var(--blue);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.err{color:var(--red);font-weight:600;font-size:.9rem}

/* Register hero */
.reg{display:grid;gap:28px}
@media (min-width:900px){.reg{grid-template-columns:1.05fr 1fr;align-items:start;gap:40px}.reg .hero{position:sticky;top:90px}}
.hero{display:grid;gap:18px}
.hero h1{max-width:12ch}
.hero .lede{font-size:1.1rem;max-width:44ch}
.features{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.features li{display:flex;gap:12px;align-items:flex-start}
.features li i{flex:0 0 12px;height:12px;border-radius:3px;margin-top:6px}

/* Day picker */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.days button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 10px;display:grid;justify-items:center;gap:4px;font-weight:700}
.days button small{font-weight:500;font-size:.72rem;color:var(--muted)}
.days button .dot{width:7px;height:7px;border-radius:50%;background:transparent}
.days button.train .dot{background:var(--blue)}
.days button.today{border-color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.days button[aria-pressed="true"] small{color:var(--on-ink);opacity:.8}
.days button[aria-pressed="true"].train .dot{background:var(--on-ink)}

/* Exercises */
.exlist{list-style:none;margin:0;padding:0;display:grid}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;opacity:0}
.ex.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.ex.done .tick svg{opacity:1}
.ex.done .exname{text-decoration:line-through;color:var(--muted)}
.exname{font-weight:700}
.exmeta{font-size:.88rem;color:var(--muted)}
.progressbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progressbar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.finisher{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:var(--ink);font-weight:600}

/* Meals */
.meal{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
.meal header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.meal .slot{font-size:.85rem;color:var(--muted);font-weight:600}
.meal h4{margin:2px 0 0;font-size:1.05rem}
.items{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.95rem}
.items dt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.items dd{margin:0}
.macros{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.macrobar{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.macrobar i{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.shop li{justify-content:flex-start}
.shop label{display:flex;gap:10px;align-items:center;flex:1}
.shop input{width:18px;height:18px;accent-color:var(--green)}
.shop input:checked+span{text-decoration:line-through;color:var(--muted)}

/* Classes */
.cls{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cls:first-child{border-top:0}
.cls time{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1}
.spots{font-size:.82rem;color:var(--muted)}

/* Water / attendance */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:34px;height:42px;border:2px solid var(--blue);border-radius:4px 4px 10px 10px;background:transparent;padding:0;position:relative;overflow:hidden}
.glass.full::after{content:"";position:absolute;inset:30% 0 0;background:var(--blue);opacity:.75}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.on{background:var(--green);border-color:var(--green)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}

/* Plans */
.svc{display:grid;gap:12px;align-content:start}
.svc .price{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1}
.svc ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.svc.on{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}

/* Member card */
.card-id{background:var(--ink);color:var(--on-ink);border-radius:18px;padding:20px;display:grid;gap:14px;max-width:420px}
.card-id .logo{font-size:1.5rem}
.card-id .brand svg{color:var(--on-ink)}
.barcode{height:54px;border-radius:6px;background:#fff;padding:6px 10px}
.barcode div{height:100%;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 13px,#111 13px 14px,transparent 14px 17px)}

/* Locked */
.locked{display:grid;gap:12px;justify-items:start;padding:28px;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface)}

/* Coach */
.chat{display:grid;gap:12px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.bubble{max-width:85%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.45}
.bubble.u{justify-self:end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.bubble.a{justify-self:start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.composer{display:flex;gap:8px}
.composer input{flex:1}

/* Chart */
.chartwrap{overflow-x:auto}

/* Dialog, toast, timer */
dialog{border:0;border-radius:18px;padding:0;max-width:min(460px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,18,.55)}
.dlg{padding:22px;display:grid;gap:16px}
.dlg .row.end{justify-content:flex-end}
.moresheet{display:grid;gap:4px}
.moresheet button{display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px 8px;font-weight:600;font-size:1rem;border-radius:10px;text-align:left}
.moresheet button svg{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#timer{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;display:none;align-items:center;gap:8px;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#timer.on{display:flex}
@media (min-width:900px){#toast,#timer{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== Marca y sitio ===== */
:root{--band:#17202A;--band-ink:#EEF0EA;--band-muted:#A9B3BD;--band-line:rgba(255,255,255,.12);--hdr:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--band:#0A0E13}}
:root[data-theme="dark"]{--band:#0A0E13}
body.mode-site{--hdr:var(--band)}
body::before{background:var(--hdr)}
.logo{display:inline-flex;align-items:center;font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1;letter-spacing:.02em;white-space:nowrap;color:inherit}
.logo .plate{display:inline-block;flex:none;width:.8em;height:.8em;margin:0 .03em 0 .05em;border-radius:50%;position:relative;background:radial-gradient(circle,#262C34 0 12%,#C9CFD6 12.5% 20%,#262C34 20.5% 24%,#D7192F 24.5% 66%,#A80F22 66.5% 72%,#D7192F 72.5%);box-shadow:inset 0 0 0 .04em rgba(0,0,0,.25)}
.logo .plate::after{content:"";position:absolute;left:44%;top:8%;width:12%;height:13%;border-radius:2px;background:#fff}
.logo .gym{font-size:.46em;background:#F2C230;color:#17202A;padding:.22em .38em .14em;border-radius:.22em;margin-left:.32em;transform:rotate(-7deg) translateY(-.42em);letter-spacing:.06em}
.logo.intro .plate{animation:roll 1.2s cubic-bezier(.2,.85,.25,1) both}
.logo.intro .gym{animation:stamp .45s 1s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes roll{from{transform:translateX(-4.6em) rotate(-560deg)}to{transform:none}}
@keyframes stamp{from{transform:rotate(-7deg) translateY(-.42em) scale(2.4);opacity:0}to{transform:rotate(-7deg) translateY(-.42em) scale(1);opacity:1}}
.logo-btn{all:unset;cursor:pointer;display:inline-flex;border-radius:8px}
.logo-btn:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
body.mode-site #top{background:var(--band);color:var(--band-ink);border-bottom-color:var(--band-line)}
.topnav{display:none;gap:2px;margin-left:18px}
.topnav button{background:none;border:0;color:var(--band-ink);font-weight:600;padding:8px 10px;border-radius:8px;opacity:.85}
.topnav button:hover{opacity:1;background:rgba(255,255,255,.08)}
@media (min-width:1040px){.topnav{display:flex}.menu-btn{display:none!important}}
.hide-sm{}
@media (max-width:620px){.hide-sm{display:none!important}}
.btn svg{width:18px;height:18px}
.btn.yellow{background:#F2C230;border-color:#F2C230;color:#17202A}
.btn.ink{background:#17202A;border-color:#17202A;color:#fff}
.btn.light-ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.round{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(10,14,19,.4);color:#fff;display:grid;place-items:center;padding:0;text-decoration:none}
.round svg{width:20px;height:20px}
.round.dark{border-color:var(--line);background:var(--surface);color:var(--ink)}
.round.wa{background:#25D366;border-color:#25D366}
body.mode-site .shell{display:block;max-width:none}
body.mode-site main#view{padding:0}
.site{--pad:clamp(18px,4.5vw,56px)}
.sec{padding:clamp(56px,8vw,104px) var(--pad);max-width:1240px;margin:0 auto}
.band{background:var(--band);color:var(--band-ink)}
.band .muted{color:var(--band-muted)}
.band .tag{background:rgba(255,255,255,.08);border-color:transparent;color:inherit;justify-self:start}
.band .link{color:#F2C230}
.tint{background:var(--surface)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:30px}
.sec-head p{max-width:52ch;margin-top:12px}
.sec h2,.appsec h2{font-size:clamp(2.5rem,6vw,4.3rem);line-height:.92;max-width:16ch}
.rail-ctl{display:flex;gap:8px}

/* Hero */
.hero-car{position:relative;background:var(--band);color:#fff;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;min-height:min(84vh,700px);display:flex;align-items:flex-end;overflow:hidden}
.art{display:block;width:100%;height:100%}
.slide .art{position:absolute;inset:0}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,19,0) 25%,rgba(10,14,19,.6) 58%,rgba(10,14,19,.95) 100%)}
.slide .copy{position:relative;z-index:1;padding:0 var(--pad) 110px;max-width:760px;display:grid;gap:18px}
.slide h1,.slide .h1{font-size:clamp(3.2rem,10vw,7.4rem);line-height:.86;color:#fff;max-width:11ch}
.slide p{font-size:clamp(1.02rem,1.6vw,1.2rem);color:#DCE1E6;max-width:44ch}
@media (min-width:900px){.slide{align-items:center}.slide::after{background:linear-gradient(90deg,rgba(10,14,19,.94) 0%,rgba(10,14,19,.62) 40%,rgba(10,14,19,0) 68%)}.slide .copy{padding-bottom:40px}}
.car-ui{position:absolute;z-index:2;left:var(--pad);right:var(--pad);bottom:26px;display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.dots button{width:34px;height:6px;border-radius:3px;border:0;background:rgba(255,255,255,.3);padding:0;transition:width .25s,background .25s}
.dots button[aria-current="true"]{background:#F2C230;width:54px}
.tdots button{background:var(--line)}
.tdots button[aria-current="true"]{background:var(--ink)}
.prog{position:absolute;top:0;left:0;right:0;height:4px;z-index:2;background:rgba(255,255,255,.1)}
.prog i{display:block;height:100%;width:0;background:#F2C230}
.prog.run i{animation:fill 7s linear forwards}
@keyframes fill{to{width:100%}}

/* Marquee */
.marquee{background:#F2C230;color:#17202A;overflow:hidden;white-space:nowrap;border-block:3px solid #17202A}
.marquee>div{display:inline-flex;gap:28px;padding:12px 0 10px;animation:mq 34s linear infinite;font-family:var(--display);font-weight:800;font-size:1.55rem}
.marquee span{display:inline-flex;align-items:center;gap:28px}
.marquee span::after{content:"";width:.62em;height:.62em;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 .18em rgba(0,0,0,.28)}
@keyframes mq{to{transform:translateX(-50%)}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 20px}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats div{display:grid;gap:8px;border-top:5px solid var(--c);padding-top:16px}
.stats b{font-family:var(--display);font-size:clamp(2.5rem,5.5vw,4.4rem);font-weight:900;line-height:.85;white-space:nowrap}

/* Rails */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(82%,360px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 8px}
.rail::-webkit-scrollbar{display:none}
.rail.coaches{grid-auto-columns:min(72%,290px)}
.railbar{height:4px;background:var(--band-line);border-radius:2px;margin-top:18px;overflow:hidden}
.railbar i{display:block;height:100%;background:#F2C230;border-radius:2px;width:30%}
.zone,.coach{scroll-snap-align:start}
.zone button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;width:100%;height:100%;border-radius:18px;overflow:hidden;background:#1F2933;color:#EEF0EA}
.zone button:focus-visible{outline:3px solid #F2C230;outline-offset:3px}
.zone .pic{aspect-ratio:4/3;overflow:hidden}
.zone .pic .art{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.zone button:hover .art{transform:scale(1.06)}
.zone .cap,.coach .cap{padding:16px 18px 18px;display:grid;gap:6px;align-content:start}
.zone .cap b,.coach .cap b{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1}
.zone .cap span{font-size:.93rem;color:var(--band-muted)}
.coach{background:#1F2933;border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.coach .pic{aspect-ratio:10/11}
.coach .link{justify-self:start}

/* Clases */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.chips::-webkit-scrollbar{display:none}
.chips button,.seg button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;min-height:42px}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:18px}
.ccard{display:grid;gap:12px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c)}
.ccard time{font-family:var(--display);font-size:2.3rem;font-weight:900;line-height:1}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}

/* App teaser */
.appsec{display:grid;gap:40px;align-items:center}
@media (min-width:900px){.appsec{grid-template-columns:1fr 1fr}}
.feats{display:grid;gap:8px}
.feat{display:grid;gap:2px;text-align:left;background:transparent;border:0;border-left:4px solid var(--line);padding:12px 16px;border-radius:0 12px 12px 0}
.feat span{color:var(--muted);font-size:.93rem}
.feat[aria-current="true"]{border-left-color:#D7192F;background:var(--bg)}
.phone{width:min(300px,80vw);margin:0 auto;border-radius:44px;background:#0B0F14;padding:11px;box-shadow:0 30px 60px rgba(0,0,0,.3),inset 0 0 0 2px #2B333D;transform:rotate(-3deg)}
.phone .scr{border-radius:34px;overflow:hidden;background:var(--bg);aspect-ratio:9/18.5;position:relative}
.phone .track{height:100%}
.notch{position:absolute;top:10px;left:50%;width:84px;height:22px;margin-left:-42px;background:#0B0F14;border-radius:12px;z-index:2}
.ps{flex:0 0 100%;scroll-snap-align:start;padding:42px 14px 14px;display:grid;align-content:start;gap:10px;font-size:.8rem;line-height:1.35;overflow:hidden}
.ps h4{font-family:var(--display);font-size:1.7rem;font-weight:900;margin:0;line-height:1}
.ps .mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.exm{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.tk{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line)}
.tk.on{background:var(--green);border-color:var(--green)}

/* Planes */
.cfg{display:grid;gap:22px}
@media (min-width:960px){.cfg{grid-template-columns:1.5fr 1fr;align-items:start}}
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.choice .badge{position:absolute;top:-11px;right:12px;background:#D7192F;color:#fff;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px}
.addons{display:grid;gap:10px}
.addon{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.addon:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.addon input{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:1px}
.summary{position:sticky;top:90px;background:var(--band);color:var(--band-ink);border-radius:22px;padding:24px;display:grid;gap:16px}
.summary .kv dt{color:var(--band-muted)}
.summary .total{font-family:var(--display);font-size:clamp(3.4rem,7vw,4.4rem);font-weight:900;line-height:.85}
.summary .muted{color:var(--band-muted)}

/* Calculadora */
.calc{display:grid;gap:22px}
@media (min-width:900px){.calc{grid-template-columns:1.1fr 1fr;align-items:start}}
.out{display:grid;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:24px}
.out .kcal{font-family:var(--display);font-size:clamp(3.8rem,9vw,5.6rem);font-weight:900;line-height:.85}
.out .kcal small{font-size:.32em;font-weight:800}

/* Opiniones */
.tslide{flex:0 0 100%;scroll-snap-align:start;padding:2px}
.quote{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,44px);display:grid;gap:20px;height:100%}
.quote blockquote{margin:0;font-size:clamp(1.15rem,2.5vw,1.65rem);line-height:1.38;font-weight:500;max-width:56ch}
.who{display:flex;align-items:center;gap:12px}
.ini{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c)}
.stars{color:#E0A800;letter-spacing:3px;font-size:1.1rem}

/* FAQ */
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px;font-size:1.05rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--display);font-size:1.7rem;line-height:.8;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 18px;color:var(--muted);max-width:65ch}

/* Ubicación */
.loc{display:grid;gap:26px}
@media (min-width:900px){.loc{grid-template-columns:1.2fr 1fr;align-items:center}}
.map{border-radius:20px;overflow:hidden;aspect-ratio:4/3}
.map .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:.6}to{transform:scale(1.7);opacity:0}}
.hours{list-style:none;margin:0;padding:0;display:grid}
.hours li{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--band-line)}
.hours li.now{color:#F2C230;font-weight:700}
.live{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.live i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px rgba(255,255,255,.08)}

/* CTA y footer */
.cta-final{background:#D7192F;color:#fff}
.cta-final h2{font-size:clamp(3rem,9vw,6.6rem);max-width:12ch}
.cta-final p{font-size:1.15rem;margin:16px 0 24px;max-width:46ch}
.foot{background:var(--band);color:var(--band-ink);padding:48px var(--pad) calc(100px + env(safe-area-inset-bottom,0px));overflow:hidden}
.foot .muted{color:var(--band-muted)}
.foot-grid{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.social{display:flex;gap:8px;flex-wrap:wrap}
.bigword{font-family:var(--display);font-weight:900;font-size:clamp(5rem,23vw,19rem);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.18);white-space:nowrap;margin-top:36px;letter-spacing:.01em}
@media (min-width:900px){.foot{padding-bottom:48px}}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--band);border-top:1px solid var(--band-line);transform:translateY(110%);transition:transform .3s}
.mbar.show{transform:none}
.mbar .btn{flex:1}
.wa-fab{display:none}
@media (min-width:900px){.mbar{display:none}.wa-fab{display:grid;place-items:center;position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.25)}.wa-fab svg{width:28px;height:28px}}

/* Lightbox */
dialog.lb{max-width:min(1000px,calc(100vw - 24px));background:#0B0F14;color:#fff}
.lbpic{aspect-ratio:4/3;max-height:70vh}
.lbcap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;flex-wrap:wrap}
.lbcap b{font-family:var(--display);font-size:1.9rem;font-weight:800}
.lbcap p{color:#C3CBD3;max-width:52ch}
.regwrap .reg .hero .logo{font-size:2.4rem}

@media (prefers-reduced-motion:reduce){.logo.intro .plate,.logo.intro .gym,.marquee>div,.map .pulse,.prog.run i{animation:none}.zone .pic .art{transition:none}}
/* Admin */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px;align-content:start}
.kpi b{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:.95}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}.dot.blue{background:var(--blue)}
.list.cob li,.list.soc li{align-items:flex-start}
.list.cob li>div:last-child{flex:none}
</style>
</head>

function calcVals(){
  const c = calc; if (!(c.weight >= 30 && c.weight <= 250 && c.height >= 120 && c.height <= 230 && c.age >= 14 && c.age <= 90)) return null;
  const bmr = 10*c.weight + 6.25*c.height - 5*c.age + (c.sex === 'mujer' ? -161 : 5);
  let k = bmr*({3:1.375,4:1.465,5:1.55,6:1.64}[c.days]) + GOALS[c.goal].kcal; k = Math.round(Math.min(3800, Math.max(1300, k))/10)*10;
  const p = Math.round(c.weight*(c.goal === 'acond' ? 1.6 : 2)), f = Math.round(k*.25/9), carb = Math.max(0, Math.round((k - p*4 - f*9)/4));
  return {k,p,f,carb};
}
function calcOut(){
  const v = calcVals();
  if (!v) return `<p class="muted">Revisa tus datos: edad entre 14 y 90 años, peso entre 30 y 250 kg y estatura entre 120 y 230 cm.</p>`;
  const pk = v.p*4, ck = v.carb*4, fk = v.f*9;
  return `<span class="small muted">Tu meta diaria aproximada para ${GOALS[calc.goal].name.toLowerCase()}</span><div class="kcal num">${v.k.toLocaleString('es-MX')}<small> kcal</small></div>
  <div class="macrobar" aria-hidden="true"><i style="flex:${pk};background:var(--blue)"></i><i style="flex:${ck};background:var(--yellow)"></i><i style="flex:${fk};background:var(--green)"></i></div>
  <div class="legend num"><span style="--c:var(--blue)">Proteína ${v.p} g</span><span style="--c:var(--yellow)">Carbohidratos ${v.carb} g</span><span style="--c:var(--green)">Grasa ${v.f} g</span></div>
  <p class="small muted">Calculado con la fórmula Mifflin-St Jeor y tu nivel de actividad. Tu coach la ajusta en tu evaluación.</p>
  <button class="btn" data-act="calc-go" style="justify-self:start">Quiero mi menú con estas calorías</button>`;
}

    <label class="f">Sexo<select name="sex" data-calc><option value="hombre" ${calc.sex==='hombre'?'selected':''}>Hombre</option><option value="mujer" ${calc.sex==='mujer'?'selected':''}>Mujer</option></select></label>

  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);

async function flush(){
  if (!dbRef) return;
  if (saving) { pending = true; return; }
  saving = true;
  try { await dbRef.set({json: JSON.stringify(S), updatedAt: Date.now()}); if (memRef && S.member) await memRef.set(memberSummary()); }

/* ---------- Cálculos ---------- */
function daysLeft(){ if (!S.membership) return 0; return Math.round((parseISO(S.membership.nextDue) - today())/86400000); }
function status(){ const d = daysLeft(); if (d <= 0) return 'bad'; if (d <= 5) return 'warn'; return 'ok'; }
function monthlyServices(){ let t = 0; if (S.services.rutina) t += SERVICES.rutina.price; if (S.services.nutri) t += SERVICES[S.services.nutri].price; return t; }
function dueAmount(planKey){ const p = PLANS[planKey || S.membership.nextPlan || S.membership.plan]; return p.price + monthlyServices()*p.months; }
function age(){ const b = parseISO(S.member.birth), t = today(); let a = t.getFullYear()-b.getFullYear(); if (t < new Date(t.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function lastWeight(){ return S.weights.length ? S.weights[S.weights.length-1].kg : S.member.weight; }
function kcalTarget(){
  const m = S.member, w = lastWeight(), h = Number(m.height), a = age();
  const bmr = 10*w + 6.25*h - 5*a + (m.sex === 'mujer' ? -161 : 5);
  const af = {3:1.375,4:1.465,5:1.55,6:1.64}[m.days] || 1.4;
  const t = bmr*af + GOALS[m.goal].kcal;
  return Math.round(Math.min(3800, Math.max(1300, t))/10)*10;
}
function bmi(){ const h = S.member.height/100; return lastWeight()/(h*h); }
function routineFor(d){
  const days = S.member.days, idx = TRAIN_MAP[days].indexOf(d);
  if (idx < 0) return {rest:true};
  const tp = TEMPL[SPLITS[days][idx]], g = GOALS[S.member.goal];
  let sets = g.sets; if (S.member.level === 'principiante') sets = Math.max(2, sets-1); if (S.member.level === 'avanzado') sets = Math.min(5, sets+1);
  return {title:tp.t, fin:g.fin, ex:tp.e.map(n => ({n, sets, reps:REPS_OVERRIDE[n] || g.reps, rest:g.rest}))};
}
function dateOfWeekday(d){ const t = today(); return addDays(t, d - wd(t)); }
function qty(q,u,s){ if (u === 'pza') return Math.max(.5, Math.round(q*s*2)/2); return Math.max(5, Math.round(q*s/5)*5); }
function fmtQty(v,u){ const n = Number.isInteger(v) ? v : v.toFixed(1).replace('.0',''); return u === 'pza' ? n + (v === 1 ? ' pieza' : ' piezas') : n + ' ' + u; }
function mealsFor(d){
  const pick = [['Desayuno','7:30',M_DES[d]],['Colación','11:00',M_COL[d%4]],['Comida','14:30',M_COM[d]],['Colación','17:30',M_COL[(d+2)%4]],['Cena','20:30',M_CEN[d]]];
  const s = Math.max(.6, kcalTarget()/pick.reduce((a,x) => a + x[2].k, 0));
  return pick.map(([slot,time,m]) => ({slot,time,n:m.n,items:m.i.map(([l,q,u]) => ({l,u,q:qty(q,u,s)})),k:Math.round(m.k*s),p:Math.round(m.p*s),c:Math.round(m.c*s),f:Math.round(m.f*s)}));
}
function nextClassDate(c){
  const t = today(); let diff = (c.day - wd(t) + 7) % 7;
  if (diff === 0) { const [h,mi] = c.time.split(':').map(Number); const now = new Date(); if (now.getHours()*60+now.getMinutes() > h*60+mi) diff = 7; }
  return addDays(t, diff);
}
function hash(s){ let h = 0; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }
function taken(c,dateStr){ return Math.floor((hash(c.id+dateStr) % 100)/100 * c.cap * .85); }
function isActive(){ return daysLeft() > 0; }

function barbell(fraction, st, animate){
  const n = fraction <= 0 ? 0 : Math.max(1, Math.ceil(fraction*4));
  const col = st === 'bad' ? 'var(--red)' : st === 'warn' ? 'var(--yellow)' : 'var(--green)';
  const H = [86,78,68,58];
  let plates = '';
  for (let k = 0; k < 4; k++) {
    const show = k < n, h = H[k], y = 50 - h/2;
    const xl = 92 - k*17, xr = 314 + k*17;
    const st2 = show ? '' : (animate ? 'opacity:0' : 'opacity:.12');
    const fill = show ? col : 'var(--line)';
    plates += `<rect class="plate" x="${xl}" y="${y}" width="14" height="${h}" rx="3" fill="${fill}" style="${st2}"/>`;
    plates += `<rect class="plate" x="${xr}" y="${y}" width="14" height="${h}" rx="3" fill="${fill}" style="${st2}"/>`;
  }
  return `<svg class="barbell" viewBox="0 0 420 100" role="img" aria-label="Barra con ${n} de 4 discos por lado: tiempo restante de tu membresía">
    <rect x="18" y="46" width="384" height="8" rx="4" fill="var(--muted)"/>
    <rect x="106" y="40" width="8" height="20" rx="2" fill="var(--ink)"/><rect x="306" y="40" width="8" height="20" rx="2" fill="var(--ink)"/>
    <rect x="114" y="47" width="192" height="6" fill="var(--ink)" opacity=".35"/>
    ${plates}</svg>`;
}

function shopList(){
  const agg = {};
  for (let d = 0; d < 7; d++) for (const m of mealsFor(d)) for (const it of m.items) { const k = it.l+'|'+it.u; agg[k] = (agg[k]||0) + it.q; }
  const rows = Object.entries(agg).sort((a,b) => a[0].localeCompare(b[0],'es')).map(([k,v]) => {
    const [l,u] = k.split('|'); let txt;
    if (u === 'pza') txt = Math.ceil(v) + (Math.ceil(v) === 1 ? ' pieza' : ' piezas');
    else if (v >= 1000) txt = (Math.round(v/100)/10).toString() + (u === 'g' ? ' kg' : ' l');
    else txt = Math.round(v/10)*10 + ' ' + u;
    return `<li><label><input type="checkbox"><span>${esc(l)}</span></label><span class="num muted small">${txt}</span></li>`;
  }).join('');
  return `<section class="panel"><h3 style="margin-bottom:8px">Lista del súper de la semana</h3><ul class="list shop">${rows}</ul></section>`;
}

function weightChart(){
  const w = S.weights;
  if (w.length < 2) return `<p class="muted small">Registra tu peso al menos dos veces para ver tu gráfica.</p>`;
  const pts = w.slice(-12), W = 560, H = 180, P = 34;
  const vals = pts.map(p => p.kg), mn = Math.min(...vals) - 1, mx = Math.max(...vals) + 1;
  const x = i => P + i*(W-2*P)/(pts.length-1), y = v => H-P - (v-mn)/(mx-mn)*(H-2*P);
  const line = pts.map((p,i) => `${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%" role="img" aria-label="Gráfica de peso de los últimos registros">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    <text x="4" y="${y(mx-1)+4}" font-size="12" fill="var(--muted)">${(mx-1).toFixed(1)}</text>
    <text x="4" y="${y(mn+1)+4}" font-size="12" fill="var(--muted)">${(mn+1).toFixed(1)}</text>
    <polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="5" fill="var(--surface)" stroke="var(--blue)" stroke-width="2.5"/><text x="${x(i)}" y="${H-12}" font-size="11" text-anchor="middle" fill="var(--muted)">${fmtShort(parseISO(p.date))}</text>`).join('')}
  </svg></div>`;
}

function coachContext(){
  const m = S.member, d = wd(today());
  let ctx = `Eres el coach del gimnasio Fierros Gym en México. Responde en español de México, en máximo 120 palabras, de forma práctica y concreta, sin títulos ni markdown. Si la persona menciona dolor, lesión o una condición médica, da orientación prudente y recomienda consultar a un profesional.\n\nDatos del socio: ${m.sex}, ${age()} años, ${lastWeight()} kg, ${m.height} cm, objetivo ${GOALS[m.goal].name.toLowerCase()}, nivel ${LEVELS[m.level].toLowerCase()}, entrena ${m.days} días por semana.`;

async function coachSend(q){
  q = q.trim(); if (!q || !sampleFn || coachBusy) return;
  coachErr = '';
  chat.push({role:'user',content:q});
  const msgs = chat.map((m,i) => i === 0 ? {role:'user',content:coachContext() + '\n\nPregunta: ' + m.content} : {role:m.role,content:m.content});
  const entry = {role:'assistant',content:''}; chat.push(entry); coachBusy = true; render();
  try {
    const r = await sampleFn(msgs, {modelTier:'quick', cache:false, onText:({text}) => { entry.content = clean(text); const log = $('#chatlog'); if (log) { log.innerHTML = chatHTML(); log.scrollTop = log.scrollHeight; } }});
    entry.content = clean(r.text);
  } catch(e) {
    chat.splice(-2, 2);
    coachErr = e && e.code === 'not_granted' ? 'Para usar el coach, permite que esta página use Claude.' : e && e.code === 'rate_limited' ? 'Demasiadas preguntas seguidas. Espera un momento y vuelve a intentarlo.' : 'No llegó la respuesta. Vuelve a enviar tu pregunta.';
  }
  coachBusy = false;
  if (view === 'coach') { render(); const log = $('#chatlog'); if (log) log.scrollTop = log.scrollHeight; }
}

let timerInt = null, timerEnd = 0;
function startRest(s){
  timerEnd = Date.now() + s*1000; const el = $('#timer'); el.classList.add('on');
  clearInterval(timerInt);
  const tick = () => { const left = Math.max(0, Math.round((timerEnd - Date.now())/1000));
    el.innerHTML = `${ic('timer')}<span>Descanso ${Math.floor(left/60)}:${pad(left%60)}</span>`;
    el.setAttribute('aria-label', `Descanso, quedan ${left} segundos. Toca para detener.`);
    if (left <= 0) { clearInterval(timerInt); el.innerHTML = `${ic('check')}<span>¡A la siguiente serie!</span>`; try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {} setTimeout(() => el.classList.remove('on'), 3000); } };

}

document.addEventListener('click', e => {

  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'plan') return; // manejado en change
  switch (act) {
    case 'close': closeDlg(); break;
    case 'more': openMore(); break;
    case 'pay-open': openPay(); break;
    case 'day': selDay = Number(a.dataset.d); render(); break;
    case 'ex': { const k = a.dataset.date, i = Number(a.dataset.i), arr = S.done[k] || (S.done[k] = []);
      const at = arr.indexOf(i); if (at >= 0) arr.splice(at,1); else arr.push(i);
      const r = routineFor(selDay); save(); render();
      if (at < 0 && r.ex && arr.length === r.ex.length) toast('Rutina completa. Buen trabajo.');
      break; }
    case 'rest': startRest(Number(a.dataset.s)); break;
    case 'checkin':
      if (!isActive()) { toast('Tu membresía está vencida. Registra tu pago para entrar.'); break; }
      if (!S.checkins.includes(iso(today()))) S.checkins.push(iso(today()));
      save(); render(); toast('Asistencia registrada.'); break;
    case 'water': { const n = Number(a.dataset.n), k = iso(today()); S.water[k] = S.water[k] === n ? n-1 : n; save(); render(); break; }
    case 'book': { const k = a.dataset.k, at = S.bookings.indexOf(k);
      if (at >= 0) { S.bookings.splice(at,1); save(); render(); toast('Reserva cancelada.'); break; }
      if (!isActive()) { toast('Tu membresía está vencida. Registra tu pago para reservar.'); break; }
      S.bookings.push(k); save(); render(); toast('Lugar reservado.'); break; }
    case 'svc-on': { const k = a.dataset.k;
      if (k === 'rutina') S.services.rutina = true; else S.services.nutri = k;
      save(); render(); toast(SERVICES[k].name + ' activado. Se suma a tu próximo pago.'); break; }
    case 'svc-off': { const k = a.dataset.k;
      if (k === 'rutina') delete S.services.rutina; else delete S.services.nutri;
      save(); render(); toast('Servicio cancelado.'); break; }
    case 'demo': { const n = a.dataset.n;
      if (n === 'reset') { const last = S.membership.payments[S.membership.payments.length-1]; const p = PLANS[S.membership.plan]; S.membership.nextDue = iso(addDays(parseISO(last ? last.date : S.member.since), p.days)); }
      else S.membership.nextDue = iso(addDays(today(), Number(n)));
      save(); go('inicio'); break; }
    case 'reset':
      dlg(`<div class="dlg"><h3>¿Borrar tu cuenta?</h3><p>Se eliminan tus datos, pagos, progreso y reservas. No se puede deshacer.</p><div class="row end"><button class="btn ghost" data-act="close">Conservar mi cuenta</button><button class="btn danger" data-act="reset-ok">Borrar mi cuenta</button></div></div>`); break;
    case 'reset-ok': S = blank(); chat = []; save(); if (memRef) { try { memRef.set({deleted:true, updatedAt:Date.now()}); } catch(e) {} } closeDlg(); view = 'sitio'; render(); toast('Cuenta borrada.'); break;
    case 'coach-q': coachSend(a.dataset.q); break;
    case 'top': window.scrollTo({top:0, behavior:reduced() ? 'auto' : 'smooth'}); break;
    case 'menu': openMenu(); break;
    case 'trial': openTrial(); break;
    case 'to-app': go('inicio'); break;
    case 'to-reg': regPreset = {plan:cfg.plan, rutina:cfg.rutina, nutri:cfg.nutri}; go('registro'); break;
    case 'car-go': case 'car-prev': case 'car-next': {
      const car = a.closest('[data-car]'); const i = act === 'car-go' ? Number(a.dataset.i) : carIndex(car) + (act === 'car-next' ? 1 : -1);
      carGo(car, i); if (car.dataset.car === 'hero') heroStart(); break; }
    case 'car-pause': heroPaused = !heroPaused; a.innerHTML = ic(heroPaused ? 'play' : 'pause'); a.setAttribute('aria-label', heroPaused ? 'Reanudar carrusel' : 'Pausar carrusel'); heroStart(); break;
    case 'rail-prev': railMove(a, -1); break;
    case 'rail-next': railMove(a, 1); break;
    case 'lb': openLb(Number(a.dataset.i)); break;
    case 'lb-prev': openLb(lbI - 1); break;
    case 'lb-next': openLb(lbI + 1); break;
    case 'phone-go': carGo(document.querySelector('[data-car="phone"]'), Number(a.dataset.i)); break;
    case 'sday': siteDay = Number(a.dataset.d); $('#site-classes').innerHTML = siteClasses(); break;
    case 'scoach': { siteCoach = a.dataset.k; const t = wd(today()); const ds = CLASSES.filter(c => c.coach === siteCoach).map(c => c.day).sort((x,y) => ((x-t+7)%7) - ((y-t+7)%7)); if (ds.length) siteDay = ds[0];

    case 'scoach-clear': siteCoach = ''; $('#site-classes').innerHTML = siteClasses(); break;

      if (S.member) { go('planes'); break; } go('registro'); break;

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f);
  if (f.id === 'reg-form') {
    const err = $('#reg-err'); const need = ['name','email','phone','birth','weight','height'];
    const miss = need.filter(k => !String(fd.get(k) || '').trim());
    let msg = '';
    if (miss.length) msg = 'Completa todos tus datos para crear tu cuenta.';
    else if (!/^\S+@\S+\.\S+$/.test(fd.get('email'))) msg = 'Escribe un correo válido, por ejemplo nombre@correo.com.';
    else if (!fd.get('terms')) msg = 'Acepta el reglamento para continuar.';
    else { const b = parseISO(fd.get('birth')); const a = (today()-b)/31557600000; if (!(a >= 14 && a < 100)) msg = 'Revisa tu fecha de nacimiento: necesitas tener al menos 14 años.'; }
    if (msg) { err.textContent = msg; err.hidden = false; err.scrollIntoView({block:'center',behavior:'smooth'}); return; }
    const plan = fd.get('plan');
    S = blank();
    S.member = {id:'FG-' + String(Date.now()).slice(-6), since:iso(today()), name:fd.get('name').trim(), email:fd.get('email').trim(), phone:fd.get('phone').trim(), birth:fd.get('birth'), sex:fd.get('sex'), weight:Number(fd.get('weight')), height:Number(fd.get('height')), goal:fd.get('goal'), level:fd.get('level'), days:Number(fd.get('days'))};
    if (fd.get('rutina')) S.services.rutina = true;
    if (fd.get('nutri')) S.services.nutri = fd.get('nutri');
    const amt = PLANS[plan].price + monthlyServices()*PLANS[plan].months;
    S.membership = {plan, nextDue:iso(addDays(today(), PLANS[plan].days)), payments:[{date:iso(today()),amount:amt,method:'Recepción',concept:'Inscripción, membresía ' + PLANS[plan].name.toLowerCase()}]};
    S.weights = [{date:iso(today()),kg:S.member.weight}];
    save(); regPreset = {}; view = 'inicio'; render(); window.scrollTo(0,0); toast('Bienvenido a Fierros Gym, ' + S.member.name.split(' ')[0] + '.');
  } else if (f.id === 'pay-form') {
    confirmPay(fd.get('method'));
  } else if (f.id === 'w-form') {
    const kg = Number(fd.get('kg')); if (!(kg >= 30 && kg <= 250)) { toast('Escribe un peso entre 30 y 250 kg.'); return; }
    const k = iso(today()), ex = S.weights.find(w => w.date === k);
    if (ex) ex.kg = kg; else S.weights.push({date:k,kg});
    save(); render(); toast('Peso guardado.');
  } else if (f.id === 'p-form') {
    Object.assign(S.member, {name:fd.get('name').trim() || S.member.name, email:fd.get('email').trim(), phone:fd.get('phone').trim(), height:Number(fd.get('height')) || S.member.height, goal:fd.get('goal'), level:fd.get('level'), days:Number(fd.get('days'))});
    save(); render(); toast('Cambios guardados. Tu rutina y tu menú se recalcularon.');
  } else if (f.id === 'trial-form') {
    const n = String(fd.get('n') || '').trim(), t = String(fd.get('t') || '').replace(/\D/g,'');
    const err = $('#trial-err');
    if (!n || t.length < 10) { err.textContent = !n ? 'Escribe tu nombre.' : 'Escribe un WhatsApp de 10 dígitos.'; err.hidden = false; return; }
    saveLead({name:n, phone:t, date:fd.get('d'), interest:fd.get('i'), createdAt:Date.now(), status:'pendiente'});
    const d = parseISO(fd.get('d')), msg = `Hola, soy ${n}. Quiero agendar mi día de prueba gratis en Fierros Gym el ${DAYS[wd(d)].toLowerCase()} ${fmtShort(d)}. Me interesa: ${fd.get('i')}. Mi número: ${t}.`;
    dlg(`<div class="dlg"><div style="font-size:3rem;line-height:1">🏋️</div><h3>¡Listo, ${esc(n.split(' ')[0])}!</h3><p>Te esperamos el <b>${DAYS[wd(d)].toLowerCase()} ${fmtShort(d)}</b>. Envía tu solicitud por WhatsApp para confirmar tu horario.</p><a class="btn" style="background:#25D366;border-color:#25D366;color:#fff" href="${wa(msg)}" target="_blank" rel="noopener">${ic('wa')}Confirmar por WhatsApp</a><button class="btn ghost" data-act="close">Cerrar</button></div>`);
  } else if (f.id === 'adm-login-form') {
    const err = $('#adm-login-err');
    if (!(window.crypto && crypto.subtle)) { err.textContent = 'Abre la página desde su dirección https para entrar al panel.'; err.hidden = false; return; }
    sha256(String(fd.get('p') || '')).then(h => {
      if (h === ADMIN_HASH) { adminUnlocked = true; try { sessionStorage.setItem('fg-admin','1'); } catch(e) {} loadAdmin(); render(); window.scrollTo(0,0); }
      else { err.textContent = 'Contraseña incorrecta.'; err.hidden = false; f.elements.namedItem('p').value = ''; f.elements.namedItem('p').focus(); }
    });
  } else if (f.id === 'adm-pay-form') {
    admPay(f.dataset.uid, fd.get('method'));
  } else if (f.id === 'calc-form') {
    return;
  } else if (f.id === 'coach-form') {
    const inp = $('#coach-in'); const q = inp.value; inp.value = ''; coachSend(q);
  }
});
$('#timer').addEventListener('click', () => { clearInterval(timerInt); $('#timer').classList.remove('on'); });
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDlg(); });
$('#dlg').addEventListener('close', () => { $('#dlg').className = ''; });
document.addEventListener('keydown', e => { const d = $('#dlg'); if (d.open && d.classList.contains('lb')) { if (e.key === 'ArrowRight') openLb(lbI + 1); if (e.key === 'ArrowLeft') openLb(lbI - 1); } });
let lbX = null;
$('#dlg').addEventListener('pointerdown', e => { lbX = e.clientX; });
$('#dlg').addEventListener('pointerup', e => { const d = $('#dlg'); if (lbX === null || !d.classList.contains('lb')) return; const dx = e.clientX - lbX; lbX = null; if (Math.abs(dx) > 50) openLb(lbI + (dx < 0 ? 1 : -1)); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'sitio') heroStart(); });

/* ---------- Arranque ---------- */
const h = (location.hash || '').slice(1);
view = S.member ? 'inicio' : 'sitio';
if (VIEWS[h] || h === 'registro') view = h;
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] || v === 'registro') go(v); });
render();

(async () => {
  if (!window.claude || !window.claude.use) { standalone = true; adminOk = true; try { adminUnlocked = sessionStorage.getItem('fg-admin') === '1'; } catch(e) {} if (!NAV.some(n => n[0] === 'admin')) NAV.push(['admin','Administración']); if (h === 'admin') view = 'admin'; render(); return; }
  try {
    const [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
    dbCap = db; userCap = user; downloadsCap = dl;
    if (user) { try { adminOk = !!(await user.isOwner()); } catch(e) {} if (adminOk && !NAV.some(n => n[0] === 'admin')) NAV.push(['admin','Administración']); }
    if (db && user) {
      const id = await user.id();
      if (id) {
        myId = id;
        const ref = db.doc('data/users/' + id + '/gym');
        const snap = await ref.get();
        dbRef = ref; memRef = db.doc('members/' + id);
        if (snap.exists) { const d = snap.data(); if (d && d.json) { S = Object.assign(blank(), JSON.parse(d.json)); try { localStorage.setItem(KEY, d.json); } catch(e) {} } }
        else if (S.member) flush();
        try { const ms = await memRef.get(); const r = ms.exists ? ms.data() : null;
          if (r && r.adminVersion && r.adminVersion !== (S.adminVersion || 0) && S.membership) { S.membership.nextDue = r.nextDue; S.membership.payments = r.payments || S.membership.payments; S.adminVersion = r.adminVersion; save(); toast('Se registró un pago en recepción. Tu membresía vence el ' + fmtDate(parseISO(S.membership.nextDue)) + '.'); }
        } catch(e) {}
      }
    }
    if (adminOk && h === 'admin') { view = 'admin'; loadAdmin(); }
    render();
  } catch(e) {}
})();
(async () => {
  if (!window.claude || !window.claude.use) return;
  try { sampleFn = await window.claude.use('sample'); if (sampleFn && view === 'coach' && S.member) render(); } catch(e) {}
})();
})();
</script>
